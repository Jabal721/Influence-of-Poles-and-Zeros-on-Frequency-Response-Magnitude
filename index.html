<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Interactive Pole-Zero Plotter</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            display: flex;
            flex-direction: column;
            align-items: center;
            background-color: #f4f4f9;
            margin: 20px;
        }

        h1 {
            color: #333;
        }

        .controls {
            margin-bottom: 15px;
            display: flex;
            gap: 15px;
            align-items: center;
            background: #fff;
            padding: 10px 20px;
            border-radius: 8px;
            box-shadow: 0 2px 5px rgba(0,0,0,0.1);
        }

        label {
            cursor: pointer;
            user-select: none;
        }

        canvas {
            border: 1px solid #ccc;
            background-color: #ffffff;
            border-radius: 4px;
            box-shadow: 0 4px 8px rgba(0,0,0,0.05);
            cursor: crosshair;
        }
    </style>
</head>
<body>

    <h1>Interactive Pole-Zero Plotter</h1>

    <div class="controls">
        <label>
            <input type="radio" name="mode" value="pole" checked onclick="currentMode='pole'"> Add Pole (x)
        </label>
        <label>
            <input type="radio" name="mode" value="zero" onclick="currentMode='zero'"> Add Zero (o)
        </label>
        <label>
            <input type="radio" name="mode" value="delete" onclick="currentMode='delete'"> Delete
        </label>
        <label>
            <input type="checkbox" id="chkConjugate" checked> Add/Move Conjugate Pair
        </label>
        <button onclick="clearAll()">Clear All</button>
    </div>

    <canvas id="zPlaneCanvas" width="600" height="600"></canvas>

    <!-- External JavaScript File -->
    <script src="script.js"></script>
</body>
</html>
